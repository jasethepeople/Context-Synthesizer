kind = "web"
previewPath = "/"
title = "ADWS — Deep Work Synthesizer"
version = "1.0.0"
id = "artifacts/adws"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 25078

[services.development]
run = "pnpm --filter @workspace/adws run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/adws", "run", "build" ]
publicDir = "artifacts/adws/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25078"
BASE_PATH = "/"
